name: Build iOS App

# 免费路径：GitHub Actions 的 macOS 云构建机，不需要你本地有 Mac
# 触发方式：仓库 Actions 页 → 左侧 "Build iOS App" → Run workflow（手动）
# 产物：ShootRight-unsigned.ipa（未签名包，配合 Windows 的 Sideloadly 免费签名安装）

on:
  workflow_dispatch:      # 手动触发（推荐）
  push:
    branches: [ main ]    # 推送到 main 分支时自动构建

jobs:
  build:
    runs-on: macos-15     # GitHub 免费托管的 macOS 构建机
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project ShootRight.xcodeproj \
            -scheme ShootRight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/ShootRight.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ 未找到构建产物：$APP_PATH"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr ShootRight-unsigned.ipa Payload
          echo "✅ 打包完成"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShootRight-unsigned-ipa
          path: ShootRight-unsigned.ipa
          retention-days: 14
